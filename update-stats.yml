name: Update GitHub Profile Stats

on:
  schedule:
    - cron: '0 2 * * *'   # rulează zilnic la 02:00 UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure images directory
        run: mkdir -p .github/stats

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Run stats generation script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit generated assets (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stats || true
          git commit -m "chore: update generated stats" || echo "no changes to commit"
          git push origin HEAD:main || echo "push failed (check default branch name)"
